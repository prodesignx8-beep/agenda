<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal & Agenda Kerja</title>
    
    <!-- Google Fonts: Lora (Serif) & Plus Jakarta Sans (Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#FAF8F5',
                        card: '#FFFFFF',
                        edge: '#E6E2D8',
                        charcoal: '#2C2A29',
                        muted: '#78736A',
                        accent: {
                            sage: '#4A6B5D',
                            terra: '#C86D51',
                            ochre: '#D99B26',
                            slate: '#5B7083'
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['Lora', 'serif']
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.03)',
                        'floating': '0 10px 40px -5px rgba(0, 0, 0, 0.08)'
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom Styles for Tactile Feel */
        body {
            background-color: #FAF8F5;
            color: #2C2A29;
            /* Subtle paper texture (optional but adds to the feel) */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
        }
        
        .card-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.05);
        }
        
        /* Custom Checkbox */
        .checkbox-custom {
            appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            border: 1px solid #E6E2D8;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            background: #FFFFFF;
        }
        .checkbox-custom:checked {
            background-color: #4A6B5D;
            border-color: #4A6B5D;
        }
        .checkbox-custom:checked::after {
            content: '';
            position: absolute;
            left: 6px;
            top: 2px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* Smooth strike-through */
        .strike-smooth {
            position: relative;
        }
        .strike-smooth::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 0;
            height: 1.5px;
            background-color: #78736A;
            transition: width 0.3s ease-out;
        }
        .done .strike-smooth::after {
            width: 100%;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E6E2D8; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #D0CCC3; }
        
        /* Loading Spinner */
        .loader {
            border: 3px solid #E6E2D8;
            border-radius: 50%;
            border-top: 3px solid #4A6B5D;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen relative pb-20">

    <!-- Lock Screen -->
    <div id="lockScreen" class="fixed inset-0 z-[100] bg-paper flex items-center justify-center transition-opacity duration-500">
        <div class="bg-card border border-edge rounded-2xl shadow-floating p-8 max-w-sm w-full mx-4 text-center transform transition-transform duration-300">
            <div class="w-12 h-12 bg-accent-sage/10 text-accent-sage rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h2 class="font-serif text-2xl text-charcoal font-medium mb-2">Jurnal Agenda</h2>
            <p class="text-sm text-muted mb-6">Masukkan kode akses untuk membuka</p>
            <form onsubmit="checkPin(event)">
                <input type="password" id="securityPin" class="w-full bg-paper border border-edge rounded-lg px-4 py-3 text-center text-xl tracking-[0.5em] focus:outline-none focus:border-accent-sage text-charcoal mb-3" placeholder="•••" autofocus>
                <p id="pinError" class="text-accent-terra text-xs mb-4 hidden font-medium">Kode keamanan salah, coba lagi.</p>
                <button type="submit" class="w-full bg-charcoal text-white px-6 py-3 rounded-lg text-sm font-medium hover:bg-black transition-colors">Buka Jurnal</button>
            </form>
        </div>
    </div>

    <!-- Navbar / Header -->
    <header class="max-w-4xl mx-auto px-5 pt-10 pb-6">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
                <p id="greetingText" class="text-muted font-medium text-sm tracking-wide uppercase mb-1">Selamat Pagi</p>
                <h1 id="dateText" class="font-serif text-3xl md:text-4xl text-charcoal font-medium leading-tight">
                    Jurnal Hari Ini
                </h1>
            </div>
            <button onclick="openModal()" class="bg-charcoal text-white hover:bg-black px-6 py-2.5 rounded-full text-sm font-medium transition-colors shadow-sm flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Tambah Agenda
            </button>
        </div>
    </header>

    <!-- Filters & Search -->
    <section class="max-w-4xl mx-auto px-5 mb-8">
        <div class="flex flex-col sm:flex-row gap-4 justify-between items-start sm:items-center">
            <!-- Tabs -->
            <div class="flex gap-2 bg-white/50 p-1 rounded-full border border-edge/50">
                <button onclick="setFilter('hari-ini')" id="btn-hari-ini" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white shadow-sm border border-edge text-charcoal transition-all">Hari Ini</button>
                <button onclick="setFilter('minggu-ini')" id="btn-minggu-ini" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium text-muted hover:text-charcoal transition-all">Minggu Ini</button>
                <button onclick="setFilter('semua')" id="btn-semua" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium text-muted hover:text-charcoal transition-all">Semua</button>
            </div>
            
            <div class="flex gap-3 w-full sm:w-auto">
                <select id="statusFilter" onchange="applyFilters()" class="bg-transparent border border-edge rounded-lg px-3 py-1.5 text-sm text-charcoal focus:outline-none focus:border-accent-sage">
                    <option value="semua">Semua Status</option>
                    <option value="belum">Belum Selesai</option>
                    <option value="selesai">Selesai</option>
                </select>
                <div class="relative flex-1 sm:w-48">
                    <input type="text" id="searchInput" onkeyup="applyFilters()" placeholder="Cari agenda..." class="w-full bg-transparent border border-edge rounded-lg pl-8 pr-3 py-1.5 text-sm focus:outline-none focus:border-accent-sage text-charcoal placeholder-muted">
                    <svg class="w-4 h-4 text-muted absolute left-2.5 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>
        </div>
    </section>

    <!-- Loading Indicator -->
    <div id="loadingState" class="max-w-4xl mx-auto px-5 py-10 flex flex-col items-center justify-center text-muted hidden">
        <div class="loader mb-3"></div>
        <p class="text-sm">Menyinkronkan data...</p>
    </div>

    <!-- Agenda List -->
    <main class="max-w-4xl mx-auto px-5">
        <div id="agendaList" class="flex flex-col gap-4">
            <!-- Cards will be injected here via JS -->
            <p id="emptyState" class="text-center text-muted py-10 italic hidden">Tidak ada agenda untuk tampilan ini. Selamat bersantai!</p>
        </div>
    </main>

    <!-- Modal Form (Hidden by default) -->
    <div id="agendaModal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="absolute inset-0 bg-paper/80 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="relative bg-card w-full max-w-lg mx-4 rounded-[16px] shadow-floating border border-edge overflow-hidden transform transition-all">
            <div class="px-6 py-5 border-b border-edge flex justify-between items-center bg-[#FDFDFB]">
                <h3 id="modalTitle" class="font-serif text-xl text-charcoal font-medium">Tambah Agenda</h3>
                <button onclick="closeModal()" class="text-muted hover:text-charcoal transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <form id="agendaForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
                <input type="hidden" id="agendaId">
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2 sm:col-span-1">
                        <label class="block text-xs font-medium text-muted mb-1">Tanggal</label>
                        <input type="date" id="tanggal" required class="w-full bg-paper border border-edge rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-accent-sage text-charcoal">
                    </div>
                    <div class="col-span-2 sm:col-span-1 grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-muted mb-1">Mulai</label>
                            <input type="time" id="jamMulai" required class="w-full bg-paper border border-edge rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-accent-sage text-charcoal">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-muted mb-1">Selesai</label>
                            <input type="time" id="jamSelesai" required class="w-full bg-paper border border-edge rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-accent-sage text-charcoal">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-muted mb-1">Judul Agenda</label>
                    <input type="text" id="judul" required placeholder="Cth: Rapat Evaluasi Q3" class="w-full bg-paper border border-edge rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-accent-sage text-charcoal placeholder-edge">
                </div>

                <div>
                    <label class="block text-xs font-medium text-muted mb-1">Kategori</label>
                    <select id="kategori" required class="w-full bg-paper border border-edge rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-accent-sage text-charcoal">
                        <option value="Kerja Utama">Kerja Utama</option>
                        <option value="Meeting">Meeting / Klien</option>
                        <option value="Desain">Desain / Produksi</option>
                        <option value="Pribadi">Pribadi</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-muted mb-1">Catatan Tambahan (Opsional)</label>
                    <textarea id="catatan" rows="3" placeholder="Tulis catatan atau detail persiapan..." class="w-full bg-paper border border-edge rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-accent-sage text-charcoal placeholder-edge resize-none"></textarea>
                </div>

                <div class="pt-4 flex items-center justify-between">
                    <button type="button" id="btnDelete" onclick="deleteAgenda()" class="text-sm text-accent-terra hover:underline hidden font-medium">Hapus</button>
                    <div class="flex gap-3 ml-auto">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-medium text-muted hover:bg-paper transition-colors">Batal</button>
                        <button type="submit" id="btnSubmit" class="bg-charcoal text-white px-6 py-2 rounded-lg text-sm font-medium hover:bg-black transition-colors flex items-center gap-2">
                            Simpan
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-charcoal text-white px-5 py-3 rounded-full text-sm shadow-floating transition-all duration-300 opacity-0 pointer-events-none translate-y-4 z-50 flex items-center gap-2">
        <svg class="w-4 h-4 text-accent-sage" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toastMsg">Tersimpan</span>
    </div>

    <script>
        /**
         * =========================================================
         * KONFIGURASI APLIKASI 
         * =========================================================
         * Masukkan URL Web App Google Apps Script Anda di bawah ini:
         */
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwTgODSKSDbi2lyZ03cLwShU-r_zUW_eVkGQcHWwUtUNmhLkWZ-PnSQCi988SYE-Lmm/exec"; 
        
        // Data State
        let agendas = [];
        let currentFilterDate = 'hari-ini'; // hari-ini, minggu-ini, semua

        // Kategori Map untuk Warna (Warna sesuai palet estetika)
        const categoryColors = {
            'Kerja Utama': 'bg-accent-slate',
            'Meeting': 'bg-accent-ochre',
            'Desain': 'bg-accent-sage',
            'Pribadi': 'bg-accent-terra'
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            updateHeader();
            // Data loading ditunda sampai user memasukkan PIN yang benar
        });

        // 0. Security Logic
        function checkPin(event) {
            if(event) event.preventDefault();
            const pinInput = document.getElementById('securityPin').value;
            const errorMsg = document.getElementById('pinError');
            
            if (pinInput === '121') {
                // Sembunyikan layar kunci dengan animasi
                const lockScreen = document.getElementById('lockScreen');
                lockScreen.classList.add('opacity-0');
                lockScreen.style.pointerEvents = 'none';
                
                setTimeout(() => {
                    lockScreen.remove();
                    // Load data setelah terbuka
                    if(WEB_APP_URL === "URL_APPS_SCRIPT_ANDA_DISINI") {
                        showToast("Mode Demo: Hubungkan URL Google Apps Script untuk menyimpan data.");
                        loadDemoData(); 
                    } else {
                        fetchData();
                    }
                }, 500);
            } else {
                // Tampilkan error dan kosongkan input
                errorMsg.classList.remove('hidden');
                document.getElementById('securityPin').value = '';
                
                // Efek getar kecil (shake)
                const card = document.querySelector('#lockScreen .bg-card');
                card.classList.add('translate-x-2');
                setTimeout(() => card.classList.replace('translate-x-2', '-translate-x-2'), 100);
                setTimeout(() => card.classList.replace('-translate-x-2', 'translate-x-2'), 200);
                setTimeout(() => card.classList.replace('translate-x-2', 'translate-x-0'), 300);
            }
        }

        // Fungsi untuk menghitung Pasaran Jawa otomatis
        function getPasaran(date) {
            // Acuan: 13 November 2026 = Jumat Wage
            const base = new Date(2026, 10, 13); // Bulan index 10 = November
            const target = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            const diffDays = Math.round((target - base) / (1000 * 60 * 60 * 24));
            
            // Urutan pasaran, index 0 diset Wage sesuai acuan
            const pasaranArray = ['Wage', 'Kliwon', 'Legi', 'Pahing', 'Pon'];
            const pasaranIndex = ((diffDays % 5) + 5) % 5; // Modulo yang aman untuk angka negatif
            
            return pasaranArray[pasaranIndex];
        }

        // 1. UI Updates & Logic
        function updateHeader() {
            const now = new Date();
            const hour = now.getHours();
            let greeting = 'Selamat Malam';
            if (hour >= 5 && hour < 12) greeting = 'Selamat Pagi';
            else if (hour >= 12 && hour < 15) greeting = 'Selamat Siang';
            else if (hour >= 15 && hour < 18) greeting = 'Selamat Sore';

            const weekday = now.toLocaleDateString('id-ID', { weekday: 'long' });
            const restOfDate = now.toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
            const pasaran = getPasaran(now);
            
            // Gabungkan menjadi format: "Jumat Wage, 13 November 2026"
            const dateStr = `${weekday} ${pasaran}, ${restOfDate}`;

            document.getElementById('greetingText').innerText = greeting;
            document.getElementById('dateText').innerText = dateStr;
            
            // Set default date in modal to today
            document.getElementById('tanggal').valueAsDate = new Date();
        }

        // 2. Fetch from Backend
        async function fetchData() {
            showLoading(true);
            try {
                const response = await fetch(`${WEB_APP_URL}?action=get`);
                const result = await response.json();
                if(result.status === 'success') {
                    agendas = result.data;
                    applyFilters();
                } else {
                    showToast("Gagal memuat data dari server.");
                }
            } catch (error) {
                console.error(error);
                showToast("Koneksi gagal. Memuat data lokal jika ada.");
            } finally {
                showLoading(false);
            }
        }

        // 3. Render Cards
        function renderAgendas(dataToRender) {
            const listContainer = document.getElementById('agendaList');
            const emptyState = document.getElementById('emptyState');
            
            listContainer.innerHTML = ''; // Clear existing (except empty state which is detached and re-attached)
            listContainer.appendChild(emptyState);

            if (dataToRender.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            // Sort by Date, then Start Time
            dataToRender.sort((a, b) => {
                const dateA = new Date(`${a.Tanggal}T${a.Jam_Mulai}`);
                const dateB = new Date(`${b.Tanggal}T${b.Jam_Mulai}`);
                return dateA - dateB;
            });

            dataToRender.forEach(item => {
                const isDone = item.Status === 'Selesai';
                const cardColor = categoryColors[item.Kategori] || 'bg-muted';
                
                // Format tanggal dilengkapi dengan nama Weton di setiap kartu
                const d = new Date(item.Tanggal);
                const pasaranName = getPasaran(d);
                const dateStr = `${d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' })} ${pasaranName}`;

                const card = document.createElement('div');
                card.className = `card-item relative bg-card border border-edge rounded-xl shadow-soft p-4 flex gap-4 ${isDone ? 'opacity-60 done' : ''}`;
                
                card.innerHTML = `
                    <!-- Color Indicator -->
                    <div class="absolute left-0 top-4 bottom-4 w-1 rounded-r-full ${cardColor}"></div>
                    
                    <!-- Time / Date -->
                    <div class="flex-shrink-0 w-20 text-right pr-2 border-r border-edge flex flex-col justify-center">
                        <span class="text-sm font-semibold text-charcoal strike-smooth ${isDone ? 'text-muted' : ''}">${item.Jam_Mulai}</span>
                        <span class="text-xs text-muted">${item.Jam_Selesai}</span>
                        <span class="text-[10px] text-muted font-medium uppercase mt-1 tracking-wider">${dateStr}</span>
                    </div>

                    <!-- Content -->
                    <div class="flex-1 flex flex-col justify-center min-w-0 py-1" onclick="openModal('${item.ID}')" style="cursor: pointer;">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="px-2 py-0.5 rounded text-[10px] font-medium bg-paper border border-edge text-muted">${item.Kategori}</span>
                        </div>
                        <h4 class="text-base font-medium text-charcoal truncate strike-smooth ${isDone ? 'text-muted' : ''}">${item.Judul}</h4>
                        ${item.Catatan ? `<p class="text-xs text-muted mt-1 truncate max-w-md">${item.Catatan}</p>` : ''}
                    </div>

                    <!-- Checkbox -->
                    <div class="flex-shrink-0 flex items-center justify-center pl-2">
                        <input type="checkbox" class="checkbox-custom" ${isDone ? 'checked' : ''} onclick="event.stopPropagation(); toggleStatus('${item.ID}')">
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // 4. Filtering & Search Logic
        function setFilter(filterType) {
            currentFilterDate = filterType;
            // Update UI buttons
            const btns = ['btn-hari-ini', 'btn-minggu-ini', 'btn-semua'];
            btns.forEach(id => {
                const btn = document.getElementById(id);
                btn.className = "filter-btn px-4 py-1.5 rounded-full text-sm font-medium transition-all";
                if(id === `btn-${filterType}`) {
                    btn.classList.add('bg-white', 'shadow-sm', 'border', 'border-edge', 'text-charcoal');
                } else {
                    btn.classList.add('text-muted', 'hover:text-charcoal');
                }
            });
            applyFilters();
        }

        function applyFilters() {
            const statusFilter = document.getElementById('statusFilter').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            // Get today and week boundaries
            const today = new Date();
            today.setHours(0,0,0,0);
            
            const startOfWeek = new Date(today);
            startOfWeek.setDate(today.getDate() - today.getDay() + (today.getDay() === 0 ? -6 : 1)); // Monday
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6); // Sunday

            const filtered = agendas.filter(item => {
                // 1. Date Filter
                let passDate = true;
                const itemDate = new Date(item.Tanggal);
                itemDate.setHours(0,0,0,0);

                if(currentFilterDate === 'hari-ini') {
                    passDate = itemDate.getTime() === today.getTime();
                } else if(currentFilterDate === 'minggu-ini') {
                    passDate = itemDate >= startOfWeek && itemDate <= endOfWeek;
                }

                // 2. Status Filter
                let passStatus = true;
                if(statusFilter === 'belum') passStatus = item.Status !== 'Selesai';
                if(statusFilter === 'selesai') passStatus = item.Status === 'Selesai';

                // 3. Search Filter
                const passSearch = item.Judul.toLowerCase().includes(searchTerm) || 
                                   (item.Catatan && item.Catatan.toLowerCase().includes(searchTerm));

                return passDate && passStatus && passSearch;
            });

            renderAgendas(filtered);
        }

        // 5. Actions: Add, Edit, Delete, Toggle
        async function handleFormSubmit(e) {
            e.preventDefault();
            const btnSubmit = document.getElementById('btnSubmit');
            const id = document.getElementById('agendaId').value;
            
            const payload = {
                action: id ? 'update' : 'create',
                data: {
                    ID: id || generateID(),
                    Tanggal: document.getElementById('tanggal').value,
                    Jam_Mulai: document.getElementById('jamMulai').value,
                    Jam_Selesai: document.getElementById('jamSelesai').value,
                    Judul: document.getElementById('judul').value,
                    Kategori: document.getElementById('kategori').value,
                    Catatan: document.getElementById('catatan').value,
                    Status: 'Belum' // Default baru
                }
            };

            // Jika update, pertahankan status sebelumnya
            if(id) {
                const existing = agendas.find(a => a.ID === id);
                if(existing) payload.data.Status = existing.Status;
            }

            btnSubmit.innerHTML = `<div class="loader w-4 h-4 border-[2px]"></div> Menyimpan...`;
            btnSubmit.disabled = true;

            await sendToServer(payload);
            
            // Update local state for immediate feedback
            if(id) {
                const index = agendas.findIndex(a => a.ID === id);
                if(index > -1) agendas[index] = payload.data;
            } else {
                agendas.push(payload.data);
            }
            
            closeModal();
            applyFilters();
            showToast("Agenda berhasil disimpan.");
            
            btnSubmit.innerHTML = 'Simpan';
            btnSubmit.disabled = false;
        }

        async function toggleStatus(id) {
            const index = agendas.findIndex(a => a.ID === id);
            if(index === -1) return;
            
            const newStatus = agendas[index].Status === 'Selesai' ? 'Belum' : 'Selesai';
            agendas[index].Status = newStatus;
            
            // Re-render UI immediately
            applyFilters(); 
            
            const payload = {
                action: 'toggle',
                id: id,
                status: newStatus
            };
            
            // Async send to server silently
            if(WEB_APP_URL !== "URL_APPS_SCRIPT_ANDA_DISINI") {
                fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Avoid CORS Preflight
                    body: JSON.stringify(payload)
                }).catch(e => console.error("Sync Error", e));
            }
        }

        async function deleteAgenda() {
            const id = document.getElementById('agendaId').value;
            if(!id) return;
            
            const btnDelete = document.getElementById('btnDelete');
            btnDelete.innerText = 'Menghapus...';

            const payload = { action: 'delete', id: id };
            await sendToServer(payload);

            agendas = agendas.filter(a => a.ID !== id);
            
            closeModal();
            applyFilters();
            showToast("Agenda dihapus.");
            btnDelete.innerText = 'Hapus';
        }

        // 6. Helpers & Server Comm
        async function sendToServer(payload) {
            if(WEB_APP_URL === "URL_APPS_SCRIPT_ANDA_DISINI") return Promise.resolve(); // Fake if no URL
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Standard for GAS CORS bypass
                    body: JSON.stringify(payload)
                });
            } catch (error) {
                console.error("Gagal menyimpan ke server:", error);
                showToast("Gagal menyimpan ke server, disimpan secara lokal.");
            }
        }

        function generateID() {
            return 'ID_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
        }

        // 7. Modal Controls
        function openModal(id = null) {
            document.getElementById('agendaForm').reset();
            const modal = document.getElementById('agendaModal');
            const btnDelete = document.getElementById('btnDelete');
            const modalTitle = document.getElementById('modalTitle');
            
            if (id) {
                const item = agendas.find(a => a.ID === id);
                if (item) {
                    document.getElementById('agendaId').value = item.ID;
                    document.getElementById('tanggal').value = item.Tanggal;
                    document.getElementById('jamMulai').value = item.Jam_Mulai;
                    document.getElementById('jamSelesai').value = item.Jam_Selesai;
                    document.getElementById('judul').value = item.Judul;
                    document.getElementById('kategori').value = item.Kategori;
                    document.getElementById('catatan').value = item.Catatan || '';
                    btnDelete.classList.remove('hidden');
                    modalTitle.innerText = 'Edit Agenda';
                }
            } else {
                document.getElementById('agendaId').value = '';
                document.getElementById('tanggal').valueAsDate = new Date();
                btnDelete.classList.add('hidden');
                modalTitle.innerText = 'Tambah Agenda';
            }
            
            modal.classList.remove('hidden');
            // Fade in animation
            setTimeout(() => {
                modal.querySelector('.bg-card').classList.add('scale-100', 'opacity-100');
                modal.querySelector('.bg-card').classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('agendaModal');
            modal.querySelector('.bg-card').classList.remove('scale-100', 'opacity-100');
            modal.querySelector('.bg-card').classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200); // match transition duration
        }

        // 8. Utils
        function showLoading(show) {
            const loader = document.getElementById('loadingState');
            if(show) {
                loader.classList.remove('hidden');
                document.getElementById('agendaList').classList.add('hidden');
            } else {
                loader.classList.add('hidden');
                document.getElementById('agendaList').classList.remove('hidden');
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
            }, 3000);
        }

        function loadDemoData() {
            const todayStr = new Date().toISOString().split('T')[0];
            agendas = [
                { ID: 'd1', Tanggal: todayStr, Jam_Mulai: '09:00', Jam_Selesai: '10:30', Judul: 'Rapat Sinkronisasi Tim', Kategori: 'Meeting', Catatan: 'Bahas Q3 dan target Q4', Status: 'Belum' },
                { ID: 'd2', Tanggal: todayStr, Jam_Mulai: '11:00', Jam_Selesai: '14:00', Judul: 'Revisi Desain Halaman Depan', Kategori: 'Desain', Catatan: 'Fokus ke estetik dan tipografi', Status: 'Selesai' },
                { ID: 'd3', Tanggal: todayStr, Jam_Mulai: '15:00', Jam_Selesai: '16:00', Judul: 'Deep Work: Coding Backend', Kategori: 'Kerja Utama', Catatan: '', Status: 'Belum' }
            ];
            applyFilters();
        }
    </script>
</body>
